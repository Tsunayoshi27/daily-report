[project]
name = "daily-report-tool"
version = "0.1.0"
description = "智能日报生成器：自动采集工作记录并生成三段式日报"
readme = "README.md"
authors = [
    { name = "tsunayoshi", email = "35278666024@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",          # GitHub / 飞书 API 同步 HTTP 客户端（ADR-001）
    "python-dotenv>=1.0.0",   # .env 加载（ADR-005）
    "python-docx>=1.1.0",     # Word 导出（ADR-006）
    "pytest>=8.0.0",          # 测试框架
]

[project.scripts]
daily-report-tool = "daily_report_tool.main:_cli"

[dependency-groups]
dev = [
    "ruff>=0.6.0",  # 静态检查，要求零告警
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
# 目标 Python 版本与运行环境一致
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: PEP 8 风格；F: Pyflakes；I: import 排序；B: bugbear；UP: pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
